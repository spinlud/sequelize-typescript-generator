name: ci

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  schedule:
    # Weekly full matrix, Mondays at 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  NODE_VERSION: "22.13"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # Type check stands in for lint: the repo has no ESLint config for its own source.
      - name: Lint (type check)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  sqlite:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: SQLite tests
        run: npm run test:sqlite

  set-matrix:
    runs-on: ubuntu-latest
    needs: checks
    outputs:
      latest: ${{ steps.matrix.outputs.latest }}
      full: ${{ steps.matrix.outputs.full }}
    steps:
      - name: Build matrices
        id: matrix
        run: |
          latest='[
            {"dialect":"postgres","image":"postgres:18","container_port":5432},
            {"dialect":"mysql","image":"mysql:9.7","container_port":3306},
            {"dialect":"mariadb","image":"mariadb:12.3","container_port":3306},
            {"dialect":"mssql","image":"mcr.microsoft.com/mssql/server:2025-latest","container_port":1433}
          ]'
          full='[
            {"dialect":"postgres","image":"postgres:18","container_port":5432},
            {"dialect":"postgres","image":"postgres:16","container_port":5432},
            {"dialect":"mysql","image":"mysql:9.7","container_port":3306},
            {"dialect":"mysql","image":"mysql:8.4","container_port":3306},
            {"dialect":"mariadb","image":"mariadb:12.3","container_port":3306},
            {"dialect":"mariadb","image":"mariadb:11.4","container_port":3306},
            {"dialect":"mssql","image":"mcr.microsoft.com/mssql/server:2025-latest","container_port":1433},
            {"dialect":"mssql","image":"mcr.microsoft.com/mssql/server:2022-latest","container_port":1433}
          ]'
          echo "latest=$(echo "$latest" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "full=$(echo "$full" | jq -c .)" >> "$GITHUB_OUTPUT"

  integration-latest:
    runs-on: ubuntu-latest
    needs: set-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.set-matrix.outputs.latest) }}
    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: Passw0rd88!
          MYSQL_DATABASE: testdb
          MYSQL_USER: sa
          MYSQL_PASSWORD: Passw0rd88!
          MYSQL_ROOT_PASSWORD: Passw0rd88!
          MARIADB_DATABASE: testdb
          MARIADB_USER: sa
          MARIADB_PASSWORD: Passw0rd88!
          MARIADB_ROOT_PASSWORD: Passw0rd88!
          ACCEPT_EULA: "Y"
          SA_PASSWORD: Passw0rd88!
          MSSQL_SA_PASSWORD: Passw0rd88!
        ports:
          - 1234:${{ matrix.container_port }}
    env:
      TEST_DB_DIALECT: ${{ matrix.dialect }}
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 1234
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Wait for database
        run: npx tsx src/tests/integration/wait-for-db.ts

      - name: Integration tests (${{ matrix.image }})
        run: npm run test:integration

  integration-full:
    runs-on: ubuntu-latest
    needs: set-matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.set-matrix.outputs.full) }}
    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: Passw0rd88!
          MYSQL_DATABASE: testdb
          MYSQL_USER: sa
          MYSQL_PASSWORD: Passw0rd88!
          MYSQL_ROOT_PASSWORD: Passw0rd88!
          MARIADB_DATABASE: testdb
          MARIADB_USER: sa
          MARIADB_PASSWORD: Passw0rd88!
          MARIADB_ROOT_PASSWORD: Passw0rd88!
          ACCEPT_EULA: "Y"
          SA_PASSWORD: Passw0rd88!
          MSSQL_SA_PASSWORD: Passw0rd88!
        ports:
          - 1234:${{ matrix.container_port }}
    env:
      TEST_DB_DIALECT: ${{ matrix.dialect }}
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 1234
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Wait for database
        run: npx tsx src/tests/integration/wait-for-db.ts

      - name: Integration tests (${{ matrix.image }})
        run: npm run test:integration

  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - sqlite
      - integration-latest
      - integration-full
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve npm dist-tag
        id: dist_tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: npm publish --provenance --access public --tag ${{ steps.dist_tag.outputs.tag }}
